name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        run: pytest --cov=aeroragx --cov-report=term-missing

      - name: Type check
        run: mypy src/aeroragx
      - name: Frozen generation regression policy
        run: |
          python scripts/check_evaluation_regression.py \
            --policy configs/evaluation_regression_v0_1.yaml
  docker-build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AeroRAG-X image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aeroragx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
