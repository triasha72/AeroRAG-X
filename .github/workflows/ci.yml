name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm

        env:
          POSTGRES_DB: aeroragx
          POSTGRES_USER: aeroragx
          POSTGRES_PASSWORD: aeroragx

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U aeroragx -d aeroragx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AERORAGX_VECTOR_DATABASE_URL: >-
        postgresql://aeroragx:aeroragx@localhost:5432/aeroragx

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector,llm,agentic]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --cov=aeroragx --cov-report=term-missing

      - name: Type check package
        run: mypy src/aeroragx

      - name: Type check selected scripts
        run: |
          mypy scripts/load_pgvector.py
          mypy scripts/benchmark_vector_backends.py
          mypy scripts/render_multimodal_report_slice_v0_1.py
          mypy scripts/build_multimodal_annotation_tasks_v0_1.py
          mypy scripts/finalize_multimodal_annotation_v0_1.py

      - name: Frozen generation regression policy
        run: |
          python scripts/check_evaluation_regression.py \
            --policy configs/evaluation_regression_v0_1.yaml

  docker-build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AeroRAG-X image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aeroragx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max