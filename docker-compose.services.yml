services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aeroragx
      POSTGRES_USER: aeroragx
      POSTGRES_PASSWORD: aeroragx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroragx -d aeroragx"]
      interval: 5s
      timeout: 3s
      retries: 20

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval_service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  inference-service:
    build:
      context: .
      dockerfile: services/inference_service/Dockerfile
    ports:
      - "8002:8002"

  agent-api:
    build:
      context: .
      dockerfile: services/agent_api/Dockerfile
    environment:
      AERORAGX_RETRIEVAL_SERVICE_URL: http://retrieval-service:8001
      AERORAGX_INFERENCE_SERVICE_URL: http://inference-service:8002
    ports:
      - "8000:8000"
    depends_on:
      - retrieval-service
      - inference-service
