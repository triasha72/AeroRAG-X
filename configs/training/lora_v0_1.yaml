version: "0.1"

experiment_name: "qwen3_0_6b_grounded_lora_v0_1"

base_model: "Qwen/Qwen3-0.6B"

provider_config:
  path: "configs/provider_v0_1.yaml"

dataset:
  source_selection_manifest: "data/training/manifests/source_documents_v0_1.json"
  example_plan_manifest: "data/training/manifests/example_plan_v0_1.json"
  training_input: "data/training/aeroragx_lora_v0_1.jsonl"
  train_input: "data/training/splits/aeroragx_lora_v0_1_train_eligible.jsonl"
  dev_input: "data/training/splits/aeroragx_lora_v0_1_dev.jsonl"
  eligibility_report: "artifacts/evaluation/aeroragx_lora_training_eligibility_v0_1.json"
  manifest_output: "data/training/manifests/aeroragx_lora_v0_1.json"

  dev_fraction: 0.10
  split_seed: 20260810

protected_evaluation:
  queries: "data/evaluation/generation_queries_v0_3.jsonl"
  base_report: "artifacts/evaluation/generation_transformers_base_v0_1.json"
  base_telemetry: "artifacts/evaluation/generation_transformers_base_telemetry_v0_1.json"
  document_manifest: "data/evaluation/generation_v0_3_protected_documents.json"

formatting:
  use_production_prompt: true
  preserve_evidence_ids: true
  preserve_structured_response: true

training:
  status: "ready_for_training"
  seed: 20260810
  max_sequence_tokens: 4096

  epochs: 3
  learning_rate: 0.0002
  weight_decay: 0.01

  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  gradient_clip_norm: 1.0

  dtype: "float16"
  device: "mps"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"

  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

outputs:
  best_adapter: "artifacts/training/adapters/aeroragx_lora_v0_1_best"
  report: "artifacts/evaluation/aeroragx_lora_training_v0_1.json"

objectives:
  improve:
    - "grounded technical completeness"
    - "atomic claim decomposition"
    - "evidence-grounded synthesis"

  preserve:
    - "unsupported refusal"
    - "citation validity"
    - "source-document coverage"
    - "structural validity"
    - "generation reliability"

notes:
  - "The frozen 32-query benchmark is evaluation-only."
  - "Do not use benchmark queries or outputs as training examples."
  - "Do not use documents listed in the protected document manifest for training."
  - "Construct training examples only from documents in the frozen source-selection manifest."
  - "Construct teacher-generation inputs only from bundles in the frozen example-plan manifest."
  - "LoRA target modules were validated against the installed Qwen3-0.6B architecture."
  - "The assistant-only MPS path passed tokenizer, shortest-sequence, longest-sequence, tiny-overfit, save, and reload gates."
