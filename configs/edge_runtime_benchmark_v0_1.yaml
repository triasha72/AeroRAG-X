version: "0.1"

model_name: "Qwen/Qwen3-0.6B"
template_runtime_config: "configs/transformers_runtime_base_v0_2.yaml"

warmup_iterations: 1
measured_iterations: 3
timeout_seconds: 120.0

max_input_tokens: 2048
max_new_tokens: 96

system_prompt: >-
  Return only a valid JSON object with one required string field named
  "answer". Do not include markdown or explanatory text outside the JSON.

user_prompt: >-
  In one concise sentence, explain why evidence-grounded technical generation
  benefits from retrieval and citation validation.

cases:
  - name: "base_cpu_float32"
    device: "cpu"
    dtype: "float32"
    adapter_path: null

  - name: "base_mps_float32"
    device: "mps"
    dtype: "float32"
    adapter_path: null

  - name: "base_mps_float16"
    device: "mps"
    dtype: "float16"
    adapter_path: null

  - name: "lora_mps_float16"
    device: "mps"
    dtype: "float16"
    adapter_path: "artifacts/training/adapters/aeroragx_lora_v0_1_best"