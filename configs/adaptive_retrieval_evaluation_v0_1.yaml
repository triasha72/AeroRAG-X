protected_constraints:
  - >-
    Do not change model configuration, retrieval configuration, sufficiency
    configuration, queries, labels, or decision rules in response to this result.
  - "Run each condition once against the same protected held-out v0.4 query set."
  - "Do not retrain, retune the rewrite, or alter retrieval depth after observing the comparison."
  - >-
    Treat no recovery activation or no measured benefit as valid results when
    the integrity checks pass.
