version: "0.1"
phase: 26

# The Phase 26 study compares the existing single-pass system with the Phase 25
# bounded policy on the same protected held-out v0.4 queries.
queries_input: "data/evaluation/generation_queries_v0_4_heldout.jsonl"
protected_baseline_report:
  "artifacts/evaluation/generation_deterministic_v0_4_heldout_baseline.json"
phase25_baseline_manifest: "artifacts/evaluation/phase25_baseline_manifest_v0_1.json"

chunks_input: "data/processed/ntrs/v0_1/chunks.jsonl"
bm25_config: "configs/bm25_v0_1.yaml"
dense_config: "configs/dense_v0_1.yaml"
hybrid_config: "configs/hybrid_v0_1.yaml"
reranker_config: "configs/reranker_v0_1.yaml"
generation_config: "configs/generation_v0_1.yaml"
sufficiency_config: "configs/sufficiency_v0_2_1.yaml"
facet_retrieval_config: "configs/facet_retrieval_v0_1.yaml"
adaptive_retrieval_config: "configs/adaptive_retrieval_v0_1.yaml"
embeddings_input: "artifacts/embeddings/ntrs_v0_1.npy"
metadata_input: "artifacts/embeddings/ntrs_v0_1_metadata.jsonl"
manifest_input: "artifacts/embeddings/ntrs_v0_1_manifest.json"

candidate_top_k: 20
evidence_top_k: 5

# These are the predeclared Phase 25 limits; Phase 26 must not tune them after
# observing the held-out result.
maximum_retrieval_passes: 2
maximum_query_rewrites: 1
minimum_successful_recoveries: 1

# Each listed file is checksummed before the paired run. Generated outputs are
# intentionally excluded because they are results, not experimental inputs.
frozen_inputs:
  - "configs/adaptive_retrieval_evaluation_v0_1.yaml"
  - "data/evaluation/generation_queries_v0_4_heldout.jsonl"
  - "artifacts/evaluation/generation_deterministic_v0_4_heldout_baseline.json"
  - "artifacts/evaluation/phase25_baseline_manifest_v0_1.json"
  - "data/processed/ntrs/v0_1/chunks.jsonl"
  - "artifacts/embeddings/ntrs_v0_1.npy"
  - "artifacts/embeddings/ntrs_v0_1_metadata.jsonl"
  - "artifacts/embeddings/ntrs_v0_1_manifest.json"
  - "configs/bm25_v0_1.yaml"
  - "configs/dense_v0_1.yaml"
  - "configs/hybrid_v0_1.yaml"
  - "configs/reranker_v0_1.yaml"
  - "configs/generation_v0_1.yaml"
  - "configs/sufficiency_v0_2_1.yaml"
  - "configs/facet_retrieval_v0_1.yaml"
  - "configs/adaptive_retrieval_v0_1.yaml"
  - "src/aeroragx/generation/adaptive_evaluation.py"
