[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroragx"
version = "0.1.0"
description = "A grounded multimodal RAG system for aerospace technical knowledge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Triasha Sarkar" }]

dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "numpy>=2.0,<3.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
  "opentelemetry-sdk>=1.44,<2.0",
  "pydantic>=2.8,<3.0",
  "pypdf>=5.0,<7.0",
  "prometheus-client>=0.25,<1.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.7,<15.0",
  "sentence-transformers>=5.6,<6.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]

vector = [
  "pgvector>=0.5,<0.6",
  "psycopg[binary]>=3.3,<4.0",
]

llm = [
  "accelerate>=1.14,<2.0",
  "peft>=0.19.1,<0.20",
  "torch>=2.4,<3.0",
  "transformers>=5.14,<6.0",
]

mlx = [
  "mlx-lm>=0.31.3,<0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

training = [
  "peft>=0.19.1,<0.20",
]
agentic = [
  "langgraph>=1.0,<2.0",
]
dev = [
  "click>=8.1,<9.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6,<1.0",
  "types-PyYAML",
]

[project.scripts]
aeroragx = "aeroragx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeroragx = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aeroragx"]

[[tool.mypy.overrides]]
module = [
  "sentence_transformers",
  "sentence_transformers.*",
  "transformers",
  "transformers.*",
  "accelerate",
  "accelerate.*",
  "peft",
  "peft.*",
  "mlx",
  "mlx.*",
  "mlx_lm",
  "mlx_lm.*",
]
ignore_missing_imports = true
